# Every scenario as a service, over the image the writ repository builds.
#
#   in a writ checkout:   make image          # tags writ:latest, once
#   here:                docker compose up   # every scenario
#                        docker compose run --rm river
#
# A service exits 0 iff every assertion for its scenario passed, so `up` is a
# pass/fail run of the whole suite and needs nothing on the host but Docker.
#
# Point at a published engine image instead when there is one:
#   docker compose build --build-arg WRIT_IMAGE=ghcr.io/writ-lang/writ:0.1.0

services:
  # The Prologue river crossing: a solution path, and the blunder `live` finds.
  river:
    build: .
    image: writ-problems
    command: ["river"]

  # Knights & knaves — the reading that makes the story consistent.
  island:
    build: .
    image: writ-problems
    command: ["island"]

  # Eight queens in fifteen lines over a domain library; all 92 boards.
  queens:
    build: .
    image: writ-problems
    command: ["queens"]

  # A blocking job shop: CAN every job finish? Finds the three-way deadlock.
  jobshop-possible:
    build: .
    image: writ-problems
    command: ["jobshop_possible"]

  # The same shop with a clock: WHICH schedule is shortest? Optimum pinned from both sides.
  jobshop-best:
    build: .
    image: writ-problems
    command: ["jobshop_best"]

  # Institutional architecture — laws, acknowledgments, and `writ compare` across an amendment.
  oversight:
    build: .
    image: writ-problems
    command: ["oversight"]

  # A regulated workflow: a declared `gap` where the rules stop.
  workflow:
    build: .
    image: writ-problems
    command: ["workflow"]

  # Access and privilege, including a one-way latch.
  access:
    build: .
    image: writ-problems
    command: ["access"]

  # Separation of duties: the toxic-combination table, and the role it misses.
  separation-of-duties:
    build: .
    image: writ-problems
    command: ["separation_of_duties"]

  # An OU move that leaves the guardrails behind — `writ compare` reports LOST.
  scp-escalation:
    build: .
    image: writ-problems
    command: ["scp_escalation"]

  # Group-based offboarding, and the direct grant that survives it.
  joiner-mover-leaver:
    build: .
    image: writ-problems
    command: ["joiner_mover_leaver"]

  # Two approvals, one person: the independence check payment forgot.
  expense-approval:
    build: .
    image: writ-problems
    command: ["expense_approval"]

  # An AI agent's tool policy: the read-only tool that carries a secret out.
  agent-guardrails:
    build: .
    image: writ-problems
    command: ["agent_guardrails"]

  # A rolling deploy: the health gate, and the rollback a migration removes.
  deployment:
    build: .
    image: writ-problems
    command: ["deployment"]

  # Payments: a lost reply, a retry, and the idempotency key.
  payments:
    build: .
    image: writ-problems
    command: ["payments"]

  # Configuration space: the flag matrix exhausted, and the order that breaks it.
  config-space:
    build: .
    image: writ-problems
    command: ["config_space"]

  # A timetable CP-SAT decided, audited: one state, two broken school rules,
  # two questions the curriculum never answered.
  timetable:
    build: .
    image: writ-problems
    command: ["timetable"]

  # `writ control` — a model's dynamics emitted as data, then re-checked.
  control:
    build: .
    image: writ-problems
    command: ["control"]

  # `writ compare --git` over a throwaway two-commit history.
  gitcompare:
    build: .
    image: writ-problems
    command: ["gitcompare"]

  # Both instruments over all sixteen properties: `writ check` against `writ derive`.
  crosscheck:
    build: .
    image: writ-problems
    command: ["crosscheck"]
